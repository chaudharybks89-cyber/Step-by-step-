<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step & Style | Shoes & Fashion</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#222}
header{background:#111;color:#fff;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:30px}header p{margin:7px 0 0;color:#ddd}
.hero{padding:35px 18px;text-align:center;background:#fff}.hero h2{font-size:28px;margin:5px 0 10px}.hero p{color:#666}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding:22px;max-width:1100px;margin:auto}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 12px #00000012}
.card img{width:100%;height:220px;object-fit:cover;border-radius:10px;background:#eee}
.card h3{margin:12px 0 6px}.price{font-size:20px;font-weight:bold;margin-bottom:12px}
.btn{display:block;text-align:center;text-decoration:none;background:#168c45;color:#fff;padding:12px;border-radius:9px;font-weight:bold}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>
<body>
<header>
  <h1>Step & Style</h1>
  <p>हर कदम में स्टाइल 👟 | Fashion that fits you 👕</p>
</header>

<section class="hero">
  <h2>Our Collection</h2>
  <p>Trendy Shoes & Clothes — Order directly on WhatsApp</p>
</section>

<section class="products">
  <div class="card">
    <img src="https://placehold.co/600x600?text=Shoes" alt="Shoes">
    <h3>Stylish Shoes</h3>
    <div class="price">₹999</div>
    <a class="btn" href="https://wa.me/919045267028?text=Hello%20Step%20%26%20Style%2C%20mujhe%20Stylish%20Shoes%20order%20karne%20hain." target="_blank">WhatsApp पर Order करें</a>
  </div>

  <div class="card">
    <img src="https://placehold.co/600x600?text=T-Shirt" alt="T-Shirt">
    <h3>Trendy T-Shirt</h3>
    <div class="price">₹499</div>
    <a class="btn" href="https://wa.me/919045267028?text=Hello%20Step%20%26%20Style%2C%20mujhe%20Trendy%20T-Shirt%20order%20karni%20hai." target="_blank">WhatsApp पर Order करें</a>
  </div>

  <div class="card">
    <img src="https://placehold.co/600x600?text=Shirt" alt="Shirt">
    <h3>Casual Shirt</h3>
    <div class="price">₹799</div>
    <a class="btn" href="https://wa.me/919045267028?text=Hello%20Step%20%26%20Style%2C%20mujhe%20Casual%20Shirt%20order%20karni%20hai." target="_blank">WhatsApp पर Order करें</a>
  </div>
</section>

<footer>© 2026 Step & Style — Shoes & Clothes</footer>
</body>
</html>
